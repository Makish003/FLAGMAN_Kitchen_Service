services:
  api:
    build: .
    restart: unless-stopped
    environment:
      FLAGMAN_PASSWORD: ${FLAGMAN_PASSWORD:?Set FLAGMAN_PASSWORD in .env}
      FLAGMAN_DEMO: ${FLAGMAN_DEMO:-false}
      FLAGMAN_DB: /data/flagman.db
      FLAGMAN_TRUSTED_PROXY: 172.28.0.10
    volumes:
      - flagman-data:/data
    networks:
      - flagman
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      flagman:
        ipv4_address: 172.28.0.10
    depends_on:
      api:
        condition: service_healthy
networks:
  flagman:
    ipam:
      config:
        - subnet: 172.28.0.0/24
volumes:
  flagman-data:
  caddy-data:
  caddy-config:
